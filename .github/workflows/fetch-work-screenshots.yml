name: Fetch work showcase screenshots

on:
  push:
    branches:
      - claude/fulatelier-cinematic-upgrade-h5wy91
    paths:
      - .github/workflows/fetch-work-screenshots.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fulatelier-cinematic-upgrade-h5wy91

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Screenshot each live project
        run: |
          mkdir -p public/work
          node -e '
          const { chromium } = require("playwright");
          const sites = [
            ["https://craftmen-omega.vercel.app/", "public/work/craftmen.png"],
            ["https://gym-three-tan.vercel.app/", "public/work/twogs.png"],
            ["https://barber-sharp.vercel.app/", "public/work/sharp.png"],
            ["https://apex-roofing-phi-navy.vercel.app/", "public/work/apex.png"],
            ["https://www.loadhunters.com/", "public/work/loadhunters.png"],
          ];
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 } });
            for (const [url, out] of sites) {
              console.log("Capturing", url);
              await page.goto(url, { waitUntil: "networkidle", timeout: 45000 });
              await page.waitForTimeout(1500);
              await page.screenshot({ path: out });
            }
            await browser.close();
          })().catch((err) => { console.error(err); process.exit(1); });
          '
          ls -la public/work

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/work
          git status --short
          git commit -m "Add work showcase screenshots" || echo "Nothing to commit"
          git push origin claude/fulatelier-cinematic-upgrade-h5wy91
